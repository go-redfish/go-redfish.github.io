baseURL = "https://go-redfish.github.io/"
title = "go-redfish"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"

# Every field below is rendered by layouts/index.html (the cards in #repos and
# the strip under the hero). A field nothing renders does not stay true.
# "status": ready = released; active = on main, no version tagged yet.
# "label" (optional) replaces the status text on the card.
[[params.repos]]
  name   = "redfish"
  status = "ready"
  label  = "v0.9.0"
  url    = "https://github.com/go-redfish/redfish"
  blurb  = "A Go client for the DMTF Redfish API of a server's BMC; the library uses only the standard library. It has service discovery, HTTP Basic or session authentication, a CA file for the BMC's certificate, bounded answers and typed errors, plus generic requests (`Get`, `Patch` with `If-Match`, `Post`, `Delete`, `WaitTask`). The Systems area covers power, boot override and order, BIOS, secure boot, power restore policy, LED, asset tag, inventories and health. The Chassis area covers power, thermals, fans, power supplies, sensors and health, through both the older and the newer resources. The Managers area covers the BMC's power and factory reset, network services, NTP, date and time, network and host interfaces, logs and virtual media. Accounts and sessions can be managed too, with passwords read only from a file or stdin and redacted everywhere. Firmware can be updated either by having the BMC fetch an image or by a streamed, size-capped upload, and the update can be followed to its end. Storage covers controllers, disks and volumes, and volumes can be created or deleted (only volumes named explicitly, with a dry run). A `Meter` turns a node's energy counter, else its polled power, into energy, never across a gap and never negative. It comes with a `redfish` command line (sessions, raw requests, `systems`, `chassis`, `managers`, `accounts`, `update`, `storage`) and a stateful mock BMC built from two DMTF trees. **Parity with the Ansible `redfish_info`, `redfish_command` and `redfish_config` modules: 99 of 99 commands**, each with its function, command and tests. **Current release v0.9.0:** `go get github.com/go-redfish/redfish@v0.9.0`."
[[params.repos]]
  name   = "docs"
  status = "active"
  label  = "on main"
  url    = "https://go-redfish.github.io/docs/"
  blurb  = "The documentation (Hugo + Hextra): getting started, the security model, the mock BMC, the command-line reference and the parity status against the Python tooling."
[[params.repos]]
  name   = "brand"
  status = "active"
  label  = "on main"
  url    = "https://github.com/go-redfish/brand"
  blurb  = "The logos of the organisation in every format: SVG in three variants, PNG from 16 to 1024 px, JPG, ICO, ICNS, the GitHub avatar and the social preview."
